name: Verify ReleaseRoom
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASEROOM_STATE_DIR: /tmp/releaseroom-ci-state
      RELEASEROOM_DEMO_DIR: /tmp/releaseroom-ci-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest tests.test_core tests.test_protocol tests.test_setup tests.test_socket -v
      - run: python3 -m releaseroom.cli demo reports/reference-release.json
      - run: python3 -m releaseroom.cli verify reports/reference-release.json
      - run: git --git-dir=/tmp/releaseroom-ci-reference/artifact.git fsck --strict
      - run: PYTHONPATH=. python3 scripts/write-reference.py
      - run: npm ci --no-audit --no-fund
      - run: npm run check:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: releaseroom-verification
          path: |
            package-lock.json
            reports
            test-results
          retention-days: 7
